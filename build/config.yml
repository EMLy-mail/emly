version: '3'

info:
  companyName: "3Git"
  productName: "EMLy"
  productIdentifier: "eu.3git.emly"
  description: "Desktop email viewer for .eml and .msg files"
  copyright: "(c) 2025, 3Git"
  comments: "EMLy - Email viewer for .eml and .msg files"
  version: "1.6.5"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations:
  - ext: eml
    name: Email Message
    description: EML File
    iconName: emlFileIcon
    role: Editor
